<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login UNAB</title>
    <link rel="icon" href="https://unab.edu.co/wp-content/uploads/2022/09/cropped-favicon-naranja-32x32.png" sizes="32x32">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js"></script>
</head>
<body>

<header>
    <img src="https://unab.edu.co/wp-content/uploads/2023/09/logo-universidad-unab.png" width="450" height="142" alt="Quiero ser UNAB" id="logo" data-height-percentage="50" data-actual-width="450" data-actual-height="142" class="unab-logo header-logo">
    <h2>Portal UNAB - Acceso</h2>
</header>

<div class="form-container" id="loginPanel">
    <h2>Iniciar Sesión</h2>

    <div class="form-group">
        <label>Código estudiantil</label>
        <input type="text" id="codigo" placeholder="Ej: 100123456">
    </div>

    <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <button class="btn btn-azul" onclick="iniciarSesion()">
        Ingresar
    </button>

    <p><a href="#" onclick="mostrarRecuperacion()">¿Olvidaste tu contraseña?</a></p>
    <p><a href="registro.html">¿No tienes cuenta? Regístrate</a></p>
</div>

<div class="form-container recovery-panel hidden" id="recuperacionPanel">
    <h2>Recuperar contraseña</h2>

    <div id="datosRecuperacion">
        <div class="form-group">
            <label>Código estudiantil</label>
            <input type="text" id="codigoRecuperacion" placeholder="Ej: 100123456">
        </div>

        <div class="form-group">
            <label>Nombre completo</label>
            <input type="text" id="nombreRecuperacion" placeholder="Como aparece en tu registro">
        </div>

        <div class="form-group">
            <label>Correo institucional</label>
            <input type="email" id="correoRecuperacion" placeholder="usuario@unab.edu.co">
        </div>

        <button class="btn btn-azul" onclick="validarRecuperacion()">Validar datos</button>
    </div>

    <div id="nuevaPasswordPanel" class="hidden">
        <div class="form-group">
            <label>Nueva contraseña</label>
            <input type="password" id="nuevaPasswordRecuperacion" placeholder="Mínimo 8 caracteres">
        </div>

        <div class="form-group">
            <label>Confirmar nueva contraseña</label>
            <input type="password" id="confirmarPasswordRecuperacion" placeholder="Repite la nueva contraseña">
        </div>

        <button class="btn btn-azul" onclick="guardarPasswordRecuperada()">Guardar contraseña</button>
    </div>

    <p><a href="#" onclick="mostrarLogin()">Volver al inicio de sesión</a></p>
</div>

<script>
let usuarioRecuperacion = null;

function iniciarSesion() {
    const codigo = document.getElementById("codigo").value.trim();
    const password = document.getElementById("password").value;
    const user = getUsers().find(item => item.codigo === codigo && item.password === password);

    if (!codigo || !password) {
        alert("Ingresa tu código y contraseña.");
        return;
    }

    if (!user) {
        alert("Código o contraseña incorrectos. Regístrate si aún no tienes cuenta.");
        return;
    }

    setCurrentUser(user);
    window.location.href = "dashboard.html";
}

function normalizarTexto(valor) {
    return valor.trim().toLowerCase();
}

function mostrarRecuperacion() {
    document.getElementById("loginPanel").classList.add("hidden");
    document.getElementById("recuperacionPanel").classList.remove("hidden");
}

function mostrarLogin() {
    document.getElementById("recuperacionPanel").classList.add("hidden");
    document.getElementById("loginPanel").classList.remove("hidden");
    usuarioRecuperacion = null;
    document.getElementById("datosRecuperacion").classList.remove("hidden");
    document.getElementById("nuevaPasswordPanel").classList.add("hidden");
}

function validarRecuperacion() {
    const codigo = document.getElementById("codigoRecuperacion").value.trim();
    const nombre = document.getElementById("nombreRecuperacion").value;
    const correo = document.getElementById("correoRecuperacion").value;

    if (!codigo || !nombre || !correo) {
        alert("Completa código, nombre y correo institucional.");
        return;
    }

    const user = getUsers().find(item =>
        item.codigo === codigo &&
        normalizarTexto(item.nombre) === normalizarTexto(nombre) &&
        normalizarTexto(item.correo) === normalizarTexto(correo)
    );

    if (!user) {
        alert("Los datos no coinciden con ningún usuario registrado.");
        return;
    }

    usuarioRecuperacion = user;
    document.getElementById("datosRecuperacion").classList.add("hidden");
    document.getElementById("nuevaPasswordPanel").classList.remove("hidden");
}

function guardarPasswordRecuperada() {
    const nueva = document.getElementById("nuevaPasswordRecuperacion").value;
    const confirmar = document.getElementById("confirmarPasswordRecuperacion").value;

    if (!nueva || !confirmar) {
        alert("Completa la nueva contraseña y su confirmación.");
        return;
    }

    if (nueva.length < 8) {
        alert("La nueva contraseña debe tener al menos 8 caracteres.");
        return;
    }

    if (nueva !== confirmar) {
        alert("Las contraseñas no coinciden.");
        return;
    }

    const users = getUsers();
    const index = users.findIndex(item => item.codigo === usuarioRecuperacion.codigo);

    if (index === -1) {
        alert("No se encontró el usuario registrado.");
        return;
    }

    users[index].password = nueva;
    saveUsers(users);
    alert("Contraseña actualizada correctamente. Ya puedes iniciar sesión.");
    mostrarLogin();
}
</script>

</body>
</html>
